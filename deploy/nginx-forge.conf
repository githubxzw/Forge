# Forge 反向代理样例（含 WebSocket 支持，日志实时推送依赖此配置）
# 放置到 /etc/nginx/conf.d/forge.conf 后 nginx -s reload

server {
    listen 80;
    server_name forge.example.com;
    # 建议强制跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name forge.example.com;

    ssl_certificate     /etc/nginx/certs/forge.pem;
    ssl_certificate_key /etc/nginx/certs/forge.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 制品上传/下载
    client_max_body_size 1024m;

    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
