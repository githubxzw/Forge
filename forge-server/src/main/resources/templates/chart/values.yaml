replicaCount: 1
image:
  repository: REPLACE
  tag: "latest"
containerPort: 8080
env: {}
healthCheck:
  enabled: false
  path: /
ingress:
  enabled: false
  host: ""
  className: nginx
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
